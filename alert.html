<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>텔레그램 알림 설정</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0f0f0f;color:#e0e0e0;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR",sans-serif;padding:20px;max-width:600px;margin:0 auto}
h1{font-size:20px;margin-bottom:20px;color:#fff}
h2{font-size:16px;margin:24px 0 12px;color:#4fc3f7}
.card{background:#1a1a1a;border:1px solid #333;border-radius:12px;padding:16px;margin-bottom:12px}
label{display:block;font-size:13px;color:#999;margin-bottom:6px}
input,select{width:100%;background:#0a0a0a;border:1px solid #444;color:#fff;border-radius:8px;padding:10px;font-size:14px;margin-bottom:12px}
input:focus,select:focus{border-color:#4fc3f7;outline:none}
.row{display:flex;gap:8px;align-items:center;margin-bottom:12px}
.row select,.row input{margin-bottom:0}
.btn{background:#4fc3f7;color:#000;border:none;border-radius:8px;padding:12px 20px;font-size:15px;font-weight:700;cursor:pointer;width:100%;margin-top:8px}
.btn.danger{background:#f44336;color:#fff}
.btn.small{width:auto;padding:8px 16px;font-size:13px;margin-top:0}
.alert-item{background:#1a1a1a;border:1px solid #333;border-radius:12px;padding:14px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
.alert-desc{font-size:14px}
.alert-desc .highlight{color:#4fc3f7;font-weight:700}
.delete-btn{background:#f44336;color:#fff;border:none;border-radius:6px;padding:6px 12px;font-size:12px;cursor:pointer}
.status{padding:10px;border-radius:8px;margin-bottom:12px;font-size:13px;display:none}
.status.ok{background:#1b5e20;color:#a5d6a7;display:block}
.status.err{background:#b71c1c;color:#ffcdd2;display:block}
.hint{font-size:12px;color:#666;margin-top:4px;line-height:1.5}
.preview{background:#0a0a0a;border:1px dashed #444;border-radius:8px;padding:12px;margin-top:12px;font-size:13px;color:#aaa}
</style>
</head>
<body>
<h1>📢 텔레그램 알림 설정</h1>

<div class="card">
<h2>알림 조건 추가</h2>
<label>조건 종류</label>
<select id="condType" onchange="updateCondUI()">
<option value="completion">완료율이 N% 미만이면</option>
<option value="absent">특정 라이더가 출근 안 하면</option>
<option value="collector">수집기가 N분 멈추면</option>
<option value="mission">미션 달성자가 N명 미만이면</option>
</select>
<div id="condInputs"></div>
<button class="btn" onclick="addAlert()">+ 알림 추가</button>
<div class="preview" id="preview"></div>
</div>

<div class="card">
<h2>등록된 알림 (<span id="count">0</span>개)</h2>
<div id="alertList"></div>
</div>

<button class="btn" onclick="saveAll()">💾 전체 저장</button>

<script>
const API_URL = 'https://saokvvmfdgybocpfamhl.supabase.co/functions/v1/baemin-test';
const API_KEY = ''; // X-API-Key (필요시 설정)
let alerts = [];
let sessionToken = '';

async function baeminApi(action, params={}) {
  const body = {action, token: sessionToken, ...params};
  const headers = {'Content-Type': 'application/json'};
  if (API_KEY) headers['X-API-Key'] = API_KEY;
  const r = await fetch(API_URL, {method:'POST', headers, body: JSON.stringify(body)});
  const j = await r.json();
  if (!j.ok) throw new Error(j.error || 'API 오류');
  return j.result;
}

async function loadAlerts() {
  try {
    // 세션 토큰 가져오기 (메인 사이트와 공유)
    try { const s = JSON.parse(localStorage.getItem('baemin_session')||'null'); if (s) sessionToken = s.token; } catch(e){}
    const res = await baeminApi('getAlertRules');
    alerts = res.rules || [];
  } catch(e) {
    console.log('알림 로드 실패, 로컬 사용:', e.message);
    alerts = JSON.parse(localStorage.getItem('tg_alerts') || '[]');
  }
  renderList();
}

function updateCondUI() {
  const t = document.getElementById('condType').value;
  const d = document.getElementById('condInputs');
  let html = '';
  if (t === 'completion') {
    html = '<label>기준 완료율 (%)</label><input type="number" id="v1" value="80" min="0" max="100">';
  } else if (t === 'absent') {
    html = '<label>라이더 이름</label><input type="text" id="v1" placeholder="예: 김태완">';
  } else if (t === 'collector') {
    html = '<label>멈춤 기준 (분)</label><input type="number" id="v1" value="30" min="5">';
  } else if (t === 'mission') {
    html = '<label>최소 달성자 수 (명)</label><input type="number" id="v1" value="5" min="1">';
  }
  d.innerHTML = html;
  updatePreview();
  document.getElementById('v1').addEventListener('input', updatePreview);
}

function getDesc(t, v) {
  if (t === 'completion') return `완료율이 <span class="highlight">${v}%</span> 미만이면 알림`;
  if (t === 'absent') return `<span class="highlight">${v}</span>님이 출근 안 하면 알림`;
  if (t === 'collector') return `수집기가 <span class="highlight">${v}분</span> 멈추면 알림`;
  if (t === 'mission') return `미션 달성자가 <span class="highlight">${v}명</span> 미만이면 알림`;
  return '';
}

function updatePreview() {
  const t = document.getElementById('condType').value;
  const v = document.getElementById('v1')?.value || '';
  document.getElementById('preview').innerHTML = '미리보기: ' + getDesc(t, v || '?');
}

function addAlert() {
  const t = document.getElementById('condType').value;
  const v = document.getElementById('v1').value.trim();
  if (!v) { alert('값을 입력하세요'); return; }
  alerts.push({type: t, value: v, id: Date.now()});
  renderList();
  updatePreview();
}

function removeAlert(id) {
  alerts = alerts.filter(a => a.id !== id);
  renderList();
}

function renderList() {
  const d = document.getElementById('alertList');
  document.getElementById('count').textContent = alerts.length;
  if (!alerts.length) { d.innerHTML = '<div class="hint">등록된 알림이 없습니다.</div>'; return; }
  d.innerHTML = alerts.map(a => `
    <div class="alert-item">
      <div class="alert-desc">${getDesc(a.type, a.value)}</div>
      <button class="delete-btn" onclick="removeAlert(${a.id})">삭제</button>
    </div>`).join('');
}

async function testConnection() {
  const st = document.getElementById('connStatus');
  st.className = 'status ok';
  st.textContent = '백엔드 봇으로 테스트 메시지를 보냅니다... (실제 구현 시 API 호출)';
  // TODO: 백엔드 API 호출로 테스트 메시지 발송
}

function saveAll() {
  saveToBackend();
}

async function saveToBackend() {
  try {
    const res = await baeminApi('saveAlertRules', {rules: alerts});
    localStorage.setItem('tg_alerts', JSON.stringify(alerts));
    alert(`저장 완료!\n- 알림 ${res.count}개가 서버에 저장됨`);
  } catch(e) {
    // 백엔드 실패시 로컬에만 저장
    localStorage.setItem('tg_alerts', JSON.stringify(alerts));
    alert(`로컬 저장 완료 (서버 저장 실패: ${e.message})\n- 알림 ${alerts.length}개`);
  }
}

async function sendTest() {
  try {
    await baeminApi('testAlert');
    alert('테스트 메시지를 텔레그램으로 보냈습니다.');
  } catch(e) {
    alert('테스트 실패: ' + e.message);
  }
}

loadAlerts();
updateCondUI();
</script>
</body>
</html>
